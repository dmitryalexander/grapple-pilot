// Optional slide relays only. No extra Grapple binding; use the native tactical key.
alias "+tactical_slide" "tactical_grapple_release; -speed; +duck; tactical_slide_down"
alias "-tactical_slide" "-duck; tactical_slide_up"
alias "+tactical_slide_toggle" "+toggle_duck; tactical_slide_toggle"
alias "-tactical_slide_toggle" "-toggle_duck"
